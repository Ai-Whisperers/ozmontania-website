services:
  web:
    build: .
    image: ozmontania:prod
    ports:
      - "3000"
    networks:
      - agent-net
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ozmontania.entrypoints=websecure"
        - "traefik.http.routers.ozmontania.rule=Host(`ozmontania.paragu-ai.com`)"
        - "traefik.http.routers.ozmontania.tls=true"
        - "traefik.http.routers.ozmontania.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ozmontania.loadbalancer.server.port=3000"
        - "traefik.docker.network=agent-net"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  agent-net:
    external: true
